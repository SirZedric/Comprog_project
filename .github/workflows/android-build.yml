name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check and build SimpleQuiz
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out project
        uses: actions/checkout@v7

      - name: Install JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Run tests, Android lint, and build APK
        shell: bash
        run: |
          set -o pipefail
          bash ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug 2>&1 | tee build-log.txt

      - name: Prepare APK download
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/SimpleQuiz-debug.apk
          (cd dist && sha256sum SimpleQuiz-debug.apk > SHA256SUMS.txt)

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: SimpleQuiz-debug
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log and check reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: SimpleQuiz-build-reports
          path: |
            build-log.txt
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14
